[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsha"
version = "1.0.0"
description = "DFSha: sistema de archivos distribuido con alta disponibilidad, rendimiento y seguridad (Sistemas Distribuidos, UPB 2026-2)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Edwin David Vélez Rodríguez" },
    { name = "José Elías Díaz Marín" },
    { name = "Santiago Andrés Martínez Lora" },
]
dependencies = [
    # fastapi y pydantic van con versión exacta porque el OpenAPI de docs/api/
    # cambia entre versiones y tests/test_contratos.py lo compara con el código.
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "pydantic-settings>=2.7",
    # uvicorn va con versión exacta porque src/dfs_common/serve.py fija TLS 1.3 sobre la
    # Config ya cargada, y eso depende de cómo arranca el servidor en esta versión.
    "uvicorn==0.54.0",
    "httpx>=0.27",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9",
    "typer>=0.12",
]

[project.scripts]
# Cliente de DFSha (tarea 16): dfs login, ls, cd, mkdir... (src/dfs_client/cli.py).
dfs = "dfs_client.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
